[package]
name = "rocalcloud"
version = "0.1.4"
edition = "2021"
license = "Apache-2.0"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net", "process", "io-util", "sync", "signal"] }
serde_json = "1"
serde_yaml = "0.9"
base64 = "0.22"
sha2 = "0.10"
rsa = { version = "0.9", features = ["sha2"] }
rand = "0.8"
zip = { version = "2", default-features = false, features = ["deflate"] }
md-5 = "0.10"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
futures-util = { version = "0.3", default-features = false }
rusqlite = { version = "0.32", features = ["bundled"] }

# Crypto (RSA keygen for Cognito) is painfully slow unoptimized; optimize dependencies even in dev builds.
[profile.dev.package."*"]
opt-level = 2
