<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rocalcloud 마을</title>
<style>
:root {
  --bg: #e9e4d6; --ink: #2b2a26; --muted: #6f6b60; --panel: #f7f3e8; --line: #d6cfbd;
  --ok: #2f7d4f; --warn: #c06a00; --bad: #b3261e; --zap: #d9a400;
  font: 13px/1.45 ui-sans-serif, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; height: 100vh; display: grid; grid-template-columns: 1fr 320px; grid-template-rows: 46px 1fr; background: var(--bg); color: var(--ink); }
header { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; padding: 0 16px; border-bottom: 1px solid var(--line); background: var(--panel); white-space: nowrap; overflow-x: auto; }
header b { font-size: 15px; letter-spacing: .01em; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; background: var(--bad); }
.dot.live { background: var(--ok); } .dot.demo { background: var(--zap); }
.spacer { flex: 1; }
header a, header button, header label { font: inherit; color: var(--ink); }
header button { border: 1px solid var(--line); background: #fff; border-radius: 6px; padding: 4px 10px; cursor: pointer; }
#stage { position: relative; min-width: 0; min-height: 0; }
canvas { display: block; width: 100%; height: 100%; }
#tip { position: absolute; pointer-events: none; background: rgba(43,42,38,.92); color: #fff; padding: 6px 9px; border-radius: 6px; font-size: 12px; display: none; max-width: 260px; }
aside { border-left: 1px solid var(--line); background: var(--panel); display: grid; grid-template-rows: auto 1fr; min-height: 0; }
aside h2 { margin: 12px 16px 6px; font-size: 13px; }
.legend { padding: 0 16px 10px; color: var(--muted); font-size: 12px; display: grid; gap: 3px; }
.legend span { display: inline-block; width: 16px; text-align: center; font-weight: 700; }
#log { list-style: none; margin: 0; padding: 0 16px 16px; overflow: auto; border-top: 1px solid var(--line); }
#log li { padding: 6px 0; border-bottom: 1px dashed var(--line); font-size: 12px; }
#log li .t { color: var(--muted); font-variant-numeric: tabular-nums; margin-right: 6px; }
#log li.ok::before { content: "✓ "; color: var(--ok); font-weight: 700; }
#log li.warn::before { content: "! "; color: var(--warn); font-weight: 700; }
#log li.bad::before { content: "✗ "; color: var(--bad); font-weight: 700; }
#log li.deny::before { content: "✋ "; }
#log li.zap::before { content: "⚡ "; }
#log li.defend::before { content: "🛡 "; }
#log li.breach::before { content: "⚠ "; color: var(--bad); font-weight: 700; }
@media (max-width: 860px) {
  body { grid-template-columns: 1fr; grid-template-rows: 46px auto 1fr; }
  #stage { aspect-ratio: 16 / 9; }
  header { gap: 10px; padding: 0 12px; }
  header label span, #mode { display: none; }
  aside { border-left: 0; border-top: 1px solid var(--line); }
}
</style>
</head>
<body>
<header>
  <b>rocalcloud 마을</b>
  <span><span id="dot" class="dot"></span><span id="mode">연결 중</span></span>
  <span class="spacer"></span>
  <label><span>속도 </span><input id="speed" type="range" min="0.5" max="3" step="0.5" value="1" aria-label="애니메이션 속도"></label>
  <button id="pause">일시정지</button>
  <button id="demo">데모 보기</button>
  <a href="/_ui" id="gui">관리 화면</a>
</header>
<div id="stage"><canvas id="c" aria-label="서비스 마을 지도. 요청이 택배원으로 표시됩니다. 같은 내용이 오른쪽 목록에 글로 나옵니다."></canvas><div id="tip"></div></div>
<aside>
  <div>
    <h2>무슨 일이 일어나고 있나</h2>
    <div class="legend">
      <div><span style="color:var(--ok)">✓</span> 성공 · <span style="color:var(--warn)">!</span> 요청 오류(4xx) · <span style="color:var(--bad)">✗</span> 서버 오류(5xx)</div>
      <div><span>✋</span> 정문 경비가 막음(IAM 거부) · <span>⚡</span> 장애 주입(chaos)</div>
      <div><span>🛡</span> 검사관 공격 방어 성공 · <span>⚠</span> 검증 실패(경고)</div>
      <div>점선 택배원 = 서비스끼리 주고받는 배달 · 보라색 모자 = 검사관</div>
    </div>
  </div>
  <ul id="log" aria-live="polite"></ul>
</aside>
<script>
"use strict";
const $ = id => document.getElementById(id);
const W = 1280, H = 720, ROAD = 360;
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

// ---------- buildings ----------
// kind picks the silhouette and icon; services lists who works there.
const B = [
  {id: "s3", name: "창고", sub: "S3", kind: "warehouse", color: "#b5763a", svc: ["s3"]},
  {id: "ddb", name: "기록보관소", sub: "DynamoDB · Kinesis", kind: "archive", color: "#4b6fb0", svc: ["dynamodb", "kinesis"]},
  {id: "sqs", name: "우체국", sub: "SQS", kind: "post", color: "#c4552d", svc: ["sqs"]},
  {id: "sns", name: "방송탑", sub: "SNS · SES · EventBridge", kind: "tower", color: "#8a4fb0", svc: ["sns", "ses", "events"]},
  {id: "lambda", name: "공방", sub: "Lambda · API Gateway", kind: "workshop", color: "#d18a1c", svc: ["lambda", "apigateway"]},
  {id: "sfn", name: "조립 라인", sub: "Step Functions", kind: "factory", color: "#c13b6b", svc: ["states"]},
  {id: "id", name: "신분증 발급소", sub: "IAM · STS · Cognito", kind: "office", color: "#3f8a7a", svc: ["iam", "sts", "cognito-idp"]},
  {id: "vault", name: "금고", sub: "KMS · Secrets · SSM", kind: "vault", color: "#5e6670", svc: ["kms", "secretsmanager", "ssm"]},
  {id: "harbor", name: "항구", sub: "ECS · RDS · ElastiCache · ALB", kind: "harbor", color: "#2c7fa8", svc: ["ecs", "rds", "elasticache", "elbv2"]},
  {id: "radar", name: "관제탑", sub: "VPC · Route 53 · Logs", kind: "radar", color: "#6a8a2f", svc: ["ec2", "route53", "logs"]},
  {id: "crane", name: "공사장", sub: "CloudFormation", kind: "crane", color: "#a8862c", svc: ["cloudformation"]},
];
B.forEach((b, i) => {
  const top = i < 6;
  b.w = 160; b.h = 175;
  b.x = top ? 170 + i * 185 : 262 + (i - 6) * 185;
  b.y = top ? 118 : 432;
  b.door = {x: b.x + b.w / 2, y: top ? b.y + b.h : b.y};
  b.count = 0; b.glow = 0; b.glowColor = "#fff"; b.act = 0; b.fail = 0;
});
const byService = {};
B.forEach(b => b.svc.forEach(s => byService[s] = b));
const GATE = {x: 82, y: ROAD};
const guard = {x: 146, y: ROAD - 34, block: 0, pass: 0};

// ---------- event → story ----------
const VERBS = {
  PutObject: "상자를 창고에 넣었습니다", GetObject: "창고에서 상자를 꺼냈습니다", DeleteObject: "상자를 버렸습니다", ListObjectsV2: "창고 목록을 확인했습니다",
  CreateBucket: "새 창고 칸을 만들었습니다", PutItem: "카드를 보관함에 꽂았습니다", GetItem: "카드를 찾아 읽었습니다", Query: "보관함을 뒤졌습니다", Scan: "보관함 전체를 훑었습니다",
  UpdateItem: "카드 내용을 고쳤습니다", SendMessage: "택배를 접수했습니다", ReceiveMessage: "택배를 찾아갔습니다", DeleteMessage: "배달 완료 처리했습니다",
  Publish: "방송을 내보냈습니다", Deliver: "배달했습니다", PutEvents: "역에 이벤트 열차가 도착했습니다", Invoke: "공방에서 작업을 돌렸습니다",
  StateEntered: "조립 라인이 다음 단계로 넘어갔습니다", ExecutionFinished: "조립이 끝났습니다", StartExecution: "조립을 시작했습니다",
  Encrypt: "금고에서 봉인했습니다", Decrypt: "금고에서 봉인을 풀었습니다", GetSecretValue: "비밀 서랍을 열었습니다", GetParameter: "설정 쪽지를 꺼냈습니다",
  ResourceStatus: "공사가 진행 중입니다", CreateStack: "공사를 시작했습니다", DeleteStack: "철거를 시작했습니다",
  TaskStateChange: "항구의 컨테이너 상태가 바뀌었습니다", StatusChanged: "항구 시설 상태가 바뀌었습니다", Forward: "교통 정리원이 손님을 안내했습니다",
  SignUp: "신분증을 신청했습니다", InitiateAuth: "신분증을 확인했습니다", CodeSent: "확인 코드를 보냈습니다", AssumeRole: "임시 출입증을 받았습니다",
  PutLogEvents: "게시판에 기록을 붙였습니다", RunInstances: "관제탑이 새 기지를 표시했습니다",
};
function story(e) {
  if (e.service === "inspector") {
    if (e.op === "RunStarted") return `검사관: 마을 보안·안정성 순찰을 시작했습니다 (${e.total || 0}건)`;
    if (e.op === "RunFinished") return `검사관: 순찰 완료 — 통과 ${e.passed}/${e.total}${e.failed ? ` (실패 ${e.failed})` : ""}`;
    if (e.blocked && e.passed) return `검사관 → ${(byService[e.target_service] || {name: "정문"}).name}: ${e.name} — 경비가 막아 방어 성공`;
    return `검사관 → ${(byService[e.target_service] || {name: e.target_service || "마을"}).name}: ${e.name} (${e.passed ? "통과" : "실패!"})`;
  }
  const verb = VERBS[e.op] || `${e.op} 처리`;
  const who = e.principal && !/:root$/.test(e.principal) ? e.principal.replace(/^arn:aws:(iam|sts)::\d+:/, "") + " — " : "";
  const tgt = e.target ? ` (${String(e.target).replace(/^arn:aws:[^:]+:[^:]*:\d*:/, "").slice(0, 40)})` : "";
  return `${who}${(byService[e.service] || {name: e.service}).name}: ${verb}${tgt}`;
}
function outcome(e) {
  if (e.service === "inspector") {
    if (e.op === "ScenarioDone") return e.passed ? (e.blocked ? "defend" : "ok") : "breach";
    return e.status >= 400 ? "breach" : "ok";
  }
  if (e.auth && e.auth.decision !== "allowed" && e.auth.enforced) return "deny";
  if (e.chaos && e.chaos.fault) return "zap";
  if (e.status >= 500 && e.status !== 299) return "bad";
  if (e.status >= 400) return "warn";
  return "ok";
}

// Where a hop starts: a trigger/source service, or the gate for client requests.
function origin(e) {
  const from = e.trigger || (e.op === "Deliver" ? e.service : null);
  if (from && byService[from === "events" ? "events" : from]) return byService[from];
  return null;
}
function destination(e) {
  if (e.service === "inspector") return e.op === "ScenarioDone" ? (byService[e.target_service] || B[0]) : null;
  if (e.op === "Deliver") {
    if (e.protocol === "lambda" || /:lambda:/.test(e.target || "")) return byService.lambda;
    return byService.sqs;
  }
  return byService[e.service];
}

// ---------- walkers ----------
const walkers = [], bubbles = [];
let speed = 1, paused = false;
function path(from, to) {
  const a = from ? from.door : GATE;
  const pts = [{x: a.x, y: a.y}];
  if (from) pts.push({x: a.x, y: ROAD});
  pts.push({x: to.door.x, y: ROAD}, {x: to.door.x, y: to.door.y});
  return pts;
}
function spawn(e) {
  const to = destination(e);
  if (!to) return;
  const from = origin(e);
  const out = outcome(e);
  if (walkers.length > 70) { land(to, out, e); return; } // too busy to draw everyone
  const pts = (out === "deny" || out === "defend") ? [{x: 20, y: ROAD}, {x: guard.x - 14, y: ROAD}] : path(from, to);
  if (!from && out !== "deny" && out !== "defend") pts.unshift({x: 20, y: ROAD});
  let len = 0;
  for (let i = 1; i < pts.length; i++) len += Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y);
  const isInsp = e.service === "inspector";
  walkers.push({pts, len, t: 0, dur: reduce ? 0.01 : Math.max(0.6, len / 380), to, from, out, e, internal: !!from, inspector: isInsp,
                color: isInsp ? "#5b2c83" : (byService[e.service] || to).color, hold: 0});
}
function land(b, out, e) {
  b.count++;
  b.act = 1;
  b.glow = 1;
  b.glowColor = {ok: "#4cc27a", warn: "#f0a030", bad: "#e5483e", zap: "#f2c200", breach: "#e5483e", defend: "#4cc27a"}[out] || "#fff";
  if (out !== "ok") b.fail = 1;
  if (e.service === "states" && e.op === "StateEntered") b.step = (b.step || 0) + 1;
  bubbles.push({x: b.door.x, y: b.door.y + (b.y > ROAD ? -18 : 18) - (b.y > ROAD ? 0 : 0), out, life: 1.4});
}
function pos(w) {
  let d = w.len * Math.min(1, w.t / w.dur);
  for (let i = 1; i < w.pts.length; i++) {
    const a = w.pts[i - 1], b = w.pts[i], s = Math.hypot(b.x - a.x, b.y - a.y);
    if (d <= s) return {x: a.x + (b.x - a.x) * (d / s || 0), y: a.y + (b.y - a.y) * (d / s || 0), dir: Math.sign(b.x - a.x) || 1};
    d -= s;
  }
  const l = w.pts[w.pts.length - 1];
  return {x: l.x, y: l.y, dir: 1};
}

// ---------- drawing ----------
const cv = $("c"), ctx = cv.getContext("2d");
let scale = 1, ox = 0, oy = 0;
function resize() {
  const r = cv.getBoundingClientRect(), dpr = devicePixelRatio || 1;
  cv.width = r.width * dpr; cv.height = r.height * dpr;
  scale = Math.min(r.width / W, r.height / H);
  ox = (r.width - W * scale) / 2; oy = (r.height - H * scale) / 2;
  ctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * ox, dpr * oy);
}
addEventListener("resize", resize);

function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function shade(hex, k) {
  const n = parseInt(hex.slice(1), 16), f = c => Math.max(0, Math.min(255, Math.round(c * k)));
  return `rgb(${f(n >> 16)},${f(n >> 8 & 255)},${f(n & 255)})`;
}

function ground(t) {
  ctx.fillStyle = "#dcd6c2"; ctx.fillRect(-2000, -2000, 5000, 5000);
  ctx.fillStyle = "#cfe0b4"; rr(0, 0, W, H, 18); ctx.fill();
  // trees
  for (let i = 0; i < 26; i++) {
    const x = (i * 211) % W + 20, y = i % 2 ? 40 + (i * 37) % 40 : H - 40 - (i * 29) % 30;
    ctx.fillStyle = "#9cbf7a"; ctx.beginPath(); ctx.arc(x, y, 14 + (i % 3) * 3, 0, 7); ctx.fill();
  }
  // road
  ctx.fillStyle = "#7d7a72"; ctx.fillRect(0, ROAD - 34, W, 68);
  ctx.strokeStyle = "#e8e2cf"; ctx.lineWidth = 3; ctx.setLineDash([22, 18]); ctx.lineDashOffset = reduce ? 0 : -t * 20;
  ctx.beginPath(); ctx.moveTo(0, ROAD); ctx.lineTo(W, ROAD); ctx.stroke(); ctx.setLineDash([]);
  // side paths to doors
  ctx.fillStyle = "#b9b3a2";
  B.forEach(b => ctx.fillRect(b.door.x - 12, Math.min(b.door.y, ROAD), 24, Math.abs(ROAD - b.door.y)));
}

function gate(t) {
  ctx.fillStyle = "#6b5b45"; ctx.fillRect(40, ROAD - 70, 12, 70); ctx.fillRect(112, ROAD - 70, 12, 70);
  ctx.fillStyle = "#8a7558"; rr(34, ROAD - 86, 96, 22, 6); ctx.fill();
  ctx.fillStyle = "#fff"; ctx.font = "600 12px sans-serif"; ctx.textAlign = "center"; ctx.fillText("정문 · IAM", 82, ROAD - 71);
  // guard
  const g = guard, raise = Math.max(g.block, 0);
  ctx.save(); ctx.translate(g.x, g.y);
  ctx.fillStyle = "#2f3e5c"; rr(-9, 8, 18, 26, 5); ctx.fill();                       // body
  ctx.fillStyle = "#f1c9a0"; ctx.beginPath(); ctx.arc(0, 0, 9, 0, 7); ctx.fill();      // head
  ctx.fillStyle = "#1e2a40"; ctx.fillRect(-10, -9, 20, 5); ctx.fillRect(-6, -13, 12, 5); // cap
  ctx.strokeStyle = "#2f3e5c"; ctx.lineWidth = 4; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(-8, 14); ctx.lineTo(-8 - 10 * raise, 14 - 18 * raise); ctx.stroke(); // stop arm
  ctx.beginPath(); ctx.moveTo(8, 14); ctx.lineTo(10 + 8 * g.pass, 24 - 10 * g.pass); ctx.stroke();
  if (raise > 0.05) { ctx.fillStyle = `rgba(229,72,62,${raise})`; ctx.font = "700 20px sans-serif"; ctx.fillText("✋", -26, -10); }
  ctx.restore();
}

function icon(b, t) {
  const cx = b.x + b.w / 2, cy = b.y + (b.y < ROAD ? 70 : 105), a = b.act;
  ctx.save(); ctx.translate(cx, cy); ctx.lineWidth = 3; ctx.strokeStyle = "#fff"; ctx.fillStyle = "#fff";
  switch (b.kind) {
    case "warehouse": for (let i = 0; i < 3; i++) { rr(-30 + i * 21, 6 - (i === 1 ? 18 * a : 0), 18, 16, 2); ctx.stroke(); } break;
    case "archive": for (let i = 0; i < 3; i++) { rr(-22, -20 + i * 15, 44, 12, 2); ctx.stroke(); ctx.fillRect(-4 + (i === 1 ? 10 * a : 0), -15 + i * 15, 8, 3); } break;
    case "post": rr(-24, -14, 48, 30, 3); ctx.stroke(); ctx.beginPath(); ctx.moveTo(-24, -14); ctx.lineTo(0, 4 - 6 * a); ctx.lineTo(24, -14); ctx.stroke(); break;
    case "tower": ctx.beginPath(); ctx.moveTo(0, 22); ctx.lineTo(0, -16); ctx.stroke();
      for (let r = 1; r <= 3; r++) { ctx.globalAlpha = Math.max(0.15, a) * (1 - r * 0.2); ctx.beginPath(); ctx.arc(0, -16, r * 9 + (reduce ? 0 : (t * 18) % 9), -2.4, -0.7); ctx.stroke(); }
      ctx.globalAlpha = 1; break;
    case "workshop": { const sp = reduce ? 0 : t * (0.6 + 6 * a); ctx.rotate(sp);
      for (let i = 0; i < 8; i++) { ctx.rotate(Math.PI / 4); ctx.fillRect(-3, -22, 6, 8); }
      ctx.beginPath(); ctx.arc(0, 0, 14, 0, 7); ctx.stroke(); break; }
    case "factory": for (let i = 0; i < 4; i++) { ctx.fillStyle = (b.step || 0) % 4 === i && a > 0.05 ? "#ffe066" : "rgba(255,255,255,.5)"; ctx.beginPath(); ctx.arc(-27 + i * 18, 0, 6, 0, 7); ctx.fill(); }
      ctx.strokeStyle = "#fff"; ctx.beginPath(); ctx.moveTo(-36, 12); ctx.lineTo(36, 12); ctx.stroke(); break;
    case "office": rr(-22, -14, 44, 30, 4); ctx.stroke(); ctx.beginPath(); ctx.arc(-9, -1, 6, 0, 7); ctx.stroke(); ctx.fillRect(2, -6, 14, 3); ctx.fillRect(2, 2, 10, 3); break;
    case "vault": ctx.beginPath(); ctx.arc(0, 0, 20, 0, 7); ctx.stroke(); ctx.rotate(a * 3); for (let i = 0; i < 3; i++) { ctx.rotate(2.09); ctx.fillRect(-2, -16, 4, 12); } break;
    case "harbor": for (let i = 0; i < 4; i++) { ctx.fillStyle = ["#e8a33d", "#e05d44", "#5aa0d8", "#78b860"][i]; ctx.fillRect(-34 + (i % 2) * 34, -14 + Math.floor(i / 2) * 15 - (i === 3 ? 10 * a : 0), 30, 12); } break;
    case "radar": ctx.beginPath(); ctx.arc(0, 0, 20, 0, 7); ctx.stroke(); ctx.rotate(reduce ? 0 : t * 2); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(18, 0); ctx.stroke(); break;
    case "crane": ctx.beginPath(); ctx.moveTo(-18, 24); ctx.lineTo(-18, -22); ctx.lineTo(30, -22); ctx.stroke();
      { const y = -10 + 22 * Math.abs(Math.sin(t * (a > 0.05 ? 3 : 0.3))); ctx.beginPath(); ctx.moveTo(20, -22); ctx.lineTo(20, y); ctx.stroke(); ctx.fillRect(13, y, 14, 10); } break;
  }
  ctx.restore();
}

function building(b, t) {
  const top = b.y < ROAD;
  // glow
  if (b.glow > 0.01) { ctx.save(); ctx.shadowColor = b.glowColor; ctx.shadowBlur = 30 * b.glow; ctx.fillStyle = b.glowColor; ctx.globalAlpha = 0.35 * b.glow; rr(b.x - 6, b.y - 6, b.w + 12, b.h + 12, 18); ctx.fill(); ctx.restore(); }
  ctx.fillStyle = shade(b.color, 0.75); rr(b.x + 6, b.y + 8, b.w, b.h, 12); ctx.fill();          // shadow
  ctx.fillStyle = b.color; rr(b.x, b.y, b.w, b.h, 12); ctx.fill();
  ctx.fillStyle = shade(b.color, 1.18);                                                            // roof band
  if (top) rr(b.x, b.y, b.w, 34, [12, 12, 0, 0]); else rr(b.x, b.y + b.h - 34, b.w, 34, [0, 0, 12, 12]);
  ctx.fill();
  // door
  ctx.fillStyle = shade(b.color, 0.55);
  if (top) rr(b.door.x - 14, b.y + b.h - 30, 28, 30, [8, 8, 0, 0]); else rr(b.door.x - 14, b.y, 28, 30, [0, 0, 8, 8]);
  ctx.fill();
  icon(b, t);
  ctx.fillStyle = "#fff"; ctx.textAlign = "center";
  const ly = top ? b.y + 23 : b.y + b.h - 13;
  ctx.font = "700 15px sans-serif"; ctx.fillText(b.name, b.x + b.w / 2, ly);
  ctx.font = "11px sans-serif"; ctx.globalAlpha = 0.9; ctx.fillText(b.sub, b.x + b.w / 2, top ? b.y + b.h - 40 : b.y + 46); ctx.globalAlpha = 1;
  if (b.count) {
    ctx.fillStyle = "rgba(0,0,0,.35)"; rr(b.x + b.w - 44, top ? b.y + b.h - 26 : b.y + 6, 38, 20, 10); ctx.fill();
    ctx.fillStyle = "#fff"; ctx.font = "600 11px sans-serif"; ctx.fillText(b.count > 999 ? "999+" : b.count, b.x + b.w - 25, top ? b.y + b.h - 12 : b.y + 20);
  }
}

function person(x, y, color, dir, t, dashed, item, isInsp) {
  const bob = reduce ? 0 : Math.sin(t * 14) * 2;
  ctx.save(); ctx.translate(x, y - 22 + bob);
  if (dashed) ctx.globalAlpha = 0.8;
  ctx.fillStyle = color; rr(-7, 6, 14, 18, 4); ctx.fill();
  ctx.fillStyle = "#f1c9a0"; ctx.beginPath(); ctx.arc(0, 0, 7, 0, 7); ctx.fill();
  if (isInsp) {
    // inspector hat & magnifying glass
    ctx.fillStyle = "#3a1b54"; ctx.fillRect(-10, -7, 20, 3); rr(-6, -13, 12, 7, 2); ctx.fill();
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(9 * dir, 10, 4, 0, 7); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(12 * dir, 13); ctx.lineTo(15 * dir, 17); ctx.stroke();
  } else {
    if (dashed) { ctx.strokeStyle = "#fff"; ctx.setLineDash([3, 3]); ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(0, 0, 10, 0, 7); ctx.stroke(); ctx.setLineDash([]); }
    ctx.fillStyle = item; rr(5 * dir, 8, 10, 9, 2); ctx.fill();                                     // parcel
  }
  ctx.strokeStyle = shade(color, 0.6); ctx.lineWidth = 3; ctx.lineCap = "round";
  const s = reduce ? 0 : Math.sin(t * 14) * 4;
  ctx.beginPath(); ctx.moveTo(-3, 24); ctx.lineTo(-3 + s, 31); ctx.moveTo(3, 24); ctx.lineTo(3 - s, 31); ctx.stroke();
  ctx.restore();
}

function bubble(bb) {
  const a = Math.min(1, bb.life);
  const sym = {ok: "✓", warn: "!", bad: "✗", zap: "⚡", deny: "✋", defend: "🛡", breach: "⚠"}[bb.out];
  const col = {ok: "#2f7d4f", warn: "#c06a00", bad: "#b3261e", zap: "#b58a00", deny: "#b3261e", defend: "#2f7d4f", breach: "#b3261e"}[bb.out];
  ctx.save(); ctx.globalAlpha = a; ctx.translate(bb.x, bb.y - (1.4 - bb.life) * 16);
  ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(0, -16, 13, 0, 7); ctx.fill();
  ctx.fillStyle = col; ctx.font = "700 15px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(sym, 0, -15);
  ctx.restore();
}

let last = performance.now(), clock = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000) * (paused ? 0 : speed);
  last = now; clock += dt;
  for (const w of walkers) {
    if (w.hold > 0) { w.hold -= dt; continue; }
    w.t += dt;
    if (w.t >= w.dur && !w.done) {
      w.done = true;
      if (w.out === "deny" || w.out === "defend") { guard.block = 1; bubbles.push({x: guard.x - 20, y: ROAD - 34, out: w.out, life: 1.4}); w.pts = [w.pts[1], {x: 0, y: ROAD}]; w.len = guard.x; w.t = 0; w.dur = 0.8; w.leaving = true; w.done = false; }
      else land(w.to, w.out, w.e);
    }
  }
  for (let i = walkers.length - 1; i >= 0; i--) if (walkers[i].done) walkers.splice(i, 1);
  for (const b of B) { b.glow = Math.max(0, b.glow - dt * 1.2); b.act = Math.max(0, b.act - dt * 0.8); }
  guard.block = Math.max(0, guard.block - dt); guard.pass = Math.max(0, guard.pass - dt * 2);
  for (const bb of bubbles) bb.life -= dt;
  while (bubbles.length && bubbles[0].life <= 0) bubbles.shift();

  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height); ctx.restore();
  ground(clock); B.forEach(b => building(b, clock)); gate(clock);
  for (const w of walkers) {
    const p = pos(w);
    if (!w.internal && !w.leaving && p.x > guard.x - 8 && p.x < guard.x + 8) guard.pass = 1;
    person(p.x, p.y, w.color, p.dir, clock + w.t, w.internal, w.out === "zap" ? "#f2c200" : "#d9b382", w.inspector);
  }
  bubbles.forEach(bubble);
  requestAnimationFrame(frame);
}

// ---------- caption log ----------
function caption(e) {
  const li = document.createElement("li");
  const out = outcome(e);
  li.className = out;
  const t = new Date(e.ts || Date.now());
  li.innerHTML = `<span class="t">${t.toTimeString().slice(0, 8)}</span>`;
  li.append(document.createTextNode(story(e) + (out === "deny" ? " — 정문에서 막혔습니다" : out === "zap" ? " — 장애 주입" : "")));
  if (e.auth && e.auth.decision !== "allowed") li.title = e.auth.reason || "";
  const log = $("log");
  log.prepend(li);
  while (log.children.length > 120) log.lastChild.remove();
}

function handle(e) {
  if (e.service === "admin") { caption({...e, op: e.op === "Reset" ? "전체 초기화" : e.op}); return; }
  if (paused) return;
  spawn(e);
  caption(e);
}

// ---------- live / demo sources ----------
let es = null, demoTimer = null;
function setMode(kind, text) { $("dot").className = "dot " + kind; $("mode").textContent = text; }
function live() {
  stopDemo();
  es = new EventSource("/_events");
  es.onopen = () => setMode("live", "실시간 연결됨");
  es.onmessage = m => { try { handle(JSON.parse(m.data)); } catch {} };
  es.onerror = () => { if (es.readyState === 2 || !opened) startDemo("에뮬레이터에 연결할 수 없어 데모를 보여 줍니다"); };
  let opened = false; es.addEventListener("open", () => opened = true);
}

// A scripted day in town: an order flows through the services, with the odd denial, throttle and failure.
const SCRIPT = [
  [{service: "apigateway", op: "Invoke", target: "shop POST /orders", status: 200}],
  [{service: "lambda", op: "Invoke", target: "create-order", trigger: "apigateway", status: 200}],
  [{service: "dynamodb", op: "PutItem", target: "orders", status: 200, principal: "arn:aws:sts::0:assumed-role/order-fn/create-order", auth: {decision: "allowed"}}],
  [{service: "sns", op: "Publish", target: "order-created", status: 200}],
  [{service: "sns", op: "Deliver", target: "arn:aws:sqs:x:0:shipping", protocol: "sqs", status: 200}, {service: "sns", op: "Deliver", target: "arn:aws:sqs:x:0:emails", protocol: "sqs", status: 200}],
  [{service: "lambda", op: "Invoke", target: "ship-order", trigger: "sqs", status: 200}],
  [{service: "s3", op: "PutObject", target: "invoices/o-1042.pdf", status: 200}],
  [{service: "ses", op: "SendEmail", status: 200}],
  [{service: "s3", op: "GetObject", target: "secret/payroll.csv", status: 403, principal: "arn:aws:iam::0:user/intern", auth: {decision: "explicitDeny", enforced: true, reason: "explicit deny in NoSecrets"}}],
  [{service: "states", op: "StartExecution", status: 200}],
  [{service: "states", op: "StateEntered", target: "Price", status: 200}],
  [{service: "states", op: "StateEntered", target: "Fulfil", status: 200}],
  [{service: "states", op: "StateEntered", target: "EachItem", status: 200}],
  [{service: "states", op: "ExecutionFinished", status: 200}],
  [{service: "dynamodb", op: "Query", status: 400, chaos: {fault: "ProvisionedThroughputExceededException"}}],
  [{service: "kms", op: "Decrypt", status: 200}, {service: "secretsmanager", op: "GetSecretValue", status: 200}],
  [{service: "cloudformation", op: "CreateStack", status: 200}],
  [{service: "cloudformation", op: "ResourceStatus", target: "app/Table", status: 200}, {service: "cloudformation", op: "ResourceStatus", target: "app/Queue", status: 200}],
  [{service: "ecs", op: "TaskStateChange", target: "service:web", status: 200}, {service: "elbv2", op: "Forward", target: "127.0.0.1:49213", status: 200}],
  [{service: "lambda", op: "Invoke", target: "flaky-job", trigger: "events", status: 500}],
  [{service: "cognito-idp", op: "InitiateAuth", status: 200}],
  [{service: "sqs", op: "ReceiveMessage", status: 200}, {service: "sqs", op: "DeleteMessage", status: 200}],
  [{service: "inspector", op: "ScenarioDone", name: "IAM 명시적 거부(Deny) 우선 차단", target_service: "s3", passed: true, blocked: true, status: 200}],
  [{service: "inspector", op: "ScenarioDone", name: "무작위·기형 입력 퍼징 (15건)", target_service: "dynamodb", passed: true, blocked: false, status: 200}],
  [{service: "route53", op: "GET /hostedzone", status: 200}, {service: "logs", op: "FilterLogEvents", status: 200}],
];
function startDemo(why) {
  if (es) { es.close(); es = null; }
  setMode("demo", why || "데모 모드");
  $("demo").textContent = "실시간 보기";
  let i = 0;
  clearInterval(demoTimer);
  demoTimer = setInterval(() => {
    if (paused) return;
    SCRIPT[i % SCRIPT.length].forEach((e, k) => setTimeout(() => handle({ts: new Date().toISOString(), principal: "arn:aws:iam::0:root", ...e}), k * 250));
    i++;
  }, 1100);
}
function stopDemo() { clearInterval(demoTimer); demoTimer = null; $("demo").textContent = "데모 보기"; }

$("demo").onclick = () => demoTimer ? live() : startDemo("데모 모드");
$("pause").onclick = () => { paused = !paused; $("pause").textContent = paused ? "다시 재생" : "일시정지"; };
$("speed").oninput = e => speed = +e.target.value;

// Tooltip: what a building does and how busy it was.
cv.addEventListener("mousemove", ev => {
  const r = cv.getBoundingClientRect();
  const x = (ev.clientX - r.left - ox) / scale, y = (ev.clientY - r.top - oy) / scale;
  const b = B.find(b => x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h);
  const tip = $("tip");
  if (!b) { tip.style.display = "none"; return; }
  tip.textContent = `${b.name} — ${b.sub}. 지금까지 ${b.count}건 처리`;
  tip.style.display = "block"; tip.style.left = (ev.clientX - r.left + 14) + "px"; tip.style.top = (ev.clientY - r.top + 14) + "px";
});
cv.addEventListener("mouseleave", () => $("tip").style.display = "none");

resize();
requestAnimationFrame(frame);
// Served by the emulator → live; opened elsewhere (file://, static hosting) or with ?demo → demo.
if (location.protocol.startsWith("http") && !new URLSearchParams(location.search).has("demo") && location.pathname.startsWith("/_town")) live();
else { $("gui").hidden = true; startDemo("데모 모드 (목업 데이터)"); }
</script>
