<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🏘️</text></svg>">
<title>rocalcloud 3D 마을</title>
<style>
:root {
  --bg: #0f172a; --ink: #f1f5f9; --muted: #94a3b8;
  --panel: rgba(15, 23, 42, 0.78); --line: rgba(148, 163, 184, 0.22);
  --ok: #34d399; --warn: #fbbf24; --bad: #f87171; --zap: #facc15; --accent: #38bdf8;
  font: 13px/1.45 ui-sans-serif, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); }
body { display: grid; grid-template-columns: 1fr 330px; grid-template-rows: 50px 1fr; }
header {
  grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; padding: 0 16px;
  background: rgba(15, 23, 42, 0.92); backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line); white-space: nowrap; overflow-x: auto; z-index: 20;
}
header b { font-size: 15px; letter-spacing: .01em; display: flex; align-items: center; gap: 6px; }
.badge3d { font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 999px; background: linear-gradient(135deg, #38bdf8, #818cf8); color: #0f172a; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; background: var(--bad); }
.dot.live { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
.dot.demo { background: var(--zap); box-shadow: 0 0 8px var(--zap); }
.spacer { flex: 1; }
header a, header button, header label { font: inherit; color: var(--ink); }
header button {
  border: 1px solid var(--line); background: rgba(30, 41, 59, 0.85); color: var(--ink);
  border-radius: 7px; padding: 4px 10px; cursor: pointer; transition: background .15s, border-color .15s;
}
header button:hover { background: rgba(51, 65, 85, 0.95); border-color: var(--accent); }
header button.active { background: rgba(56, 189, 248, 0.22); border-color: var(--accent); color: #e0f2fe; }
header a { text-decoration: none; padding: 4px 8px; border-radius: 6px; border: 1px solid var(--line); }
header a:hover { border-color: var(--accent); }
#stage { position: relative; min-width: 0; min-height: 0; overflow: hidden; }
canvas#c { display: block; width: 100%; height: 100%; cursor: grab; }
canvas#c:active { cursor: grabbing; }
#labels, #fx { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.blabel {
  position: absolute; transform: translate(-50%, -100%); padding: 3px 8px; border-radius: 999px;
  background: rgba(15, 23, 42, 0.78); backdrop-filter: blur(6px); border: 1px solid rgba(255,255,255,0.16);
  color: #fff; font-size: 11px; font-weight: 600; white-space: nowrap; display: flex; align-items: center; gap: 5px;
  box-shadow: 0 4px 12px rgba(0,0,0,.35); transition: transform .15s, border-color .15s;
}
.blabel .cnt { background: rgba(56,189,248,.25); color: #bae6fd; padding: 0 5px; border-radius: 999px; font-variant-numeric: tabular-nums; font-size: 10px; }
.blabel.hot { border-color: #38bdf8; transform: translate(-50%, -112%) scale(1.06); }
.pop {
  position: absolute; transform: translate(-50%, -50%); font-size: 18px; font-weight: 700;
  padding: 2px 8px; border-radius: 999px; background: rgba(15,23,42,.88); border: 1px solid rgba(255,255,255,.25);
  box-shadow: 0 6px 16px rgba(0,0,0,.45); will-change: transform, opacity;
}
#tip {
  position: absolute; pointer-events: none; display: none; z-index: 15; max-width: 260px;
  background: rgba(15, 23, 42, 0.94); border: 1px solid rgba(56, 189, 248, 0.45);
  color: #f8fafc; padding: 8px 11px; border-radius: 8px; font-size: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.5);
}
#hud {
  position: absolute; left: 14px; bottom: 14px; display: flex; gap: 6px; flex-wrap: wrap; z-index: 10;
}
#hud button {
  font: inherit; font-size: 12px; padding: 5px 10px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--panel); backdrop-filter: blur(8px);
  color: var(--ink); cursor: pointer;
}
#hud button:hover { border-color: var(--accent); }
#hud button.active { border-color: var(--accent); background: rgba(56, 189, 248, 0.25); }
#hint3d {
  position: absolute; right: 14px; bottom: 14px; font-size: 11px; color: rgba(241,245,249,.72);
  background: var(--panel); backdrop-filter: blur(6px); padding: 4px 10px; border-radius: 999px;
  border: 1px solid var(--line); pointer-events: none;
}
aside {
  border-left: 1px solid var(--line); background: rgba(15, 23, 42, 0.94);
  display: grid; grid-template-rows: auto 1fr; min-height: 0; z-index: 10;
}
aside h2 { margin: 12px 16px 6px; font-size: 13px; color: #e2e8f0; }
.legend { padding: 0 16px 10px; color: var(--muted); font-size: 12px; display: grid; gap: 3px; }
.legend span { display: inline-block; width: 16px; text-align: center; font-weight: 700; }
#log { list-style: none; margin: 0; padding: 0 16px 16px; overflow: auto; border-top: 1px solid var(--line); }
#log li { padding: 7px 0; border-bottom: 1px dashed var(--line); font-size: 12px; color: #e2e8f0; }
#log li .t { color: var(--muted); font-variant-numeric: tabular-nums; margin-right: 6px; }
#log li.ok::before { content: "✓ "; color: var(--ok); font-weight: 700; }
#log li.warn::before { content: "! "; color: var(--warn); font-weight: 700; }
#log li.bad::before { content: "✗ "; color: var(--bad); font-weight: 700; }
#log li.deny::before { content: "✋ "; }
#log li.zap::before { content: "⚡ "; }
#log li.defend::before { content: "🛡 "; }
#log li.breach::before { content: "⚠ "; color: var(--bad); font-weight: 700; }
@media (max-width: 900px) {
  body { grid-template-columns: 1fr; grid-template-rows: 50px 58vh 1fr; }
  header label span, #mode, #hint3d { display: none; }
  aside { border-left: 0; border-top: 1px solid var(--line); }
}
</style>
</head>
<body>
<header>
  <b>rocalcloud 마을 <span class="badge3d">3D</span></b>
  <span><span id="dot" class="dot"></span><span id="mode">연결 중</span></span>
  <span class="spacer"></span>
  <label><span>속도 </span><input id="speed" type="range" min="0.5" max="3" step="0.5" value="1" aria-label="애니메이션 속도"></label>
  <button id="pause">일시정지</button>
  <button id="demo">데모 보기</button>
  <a href="/_ui" id="gui">관리 화면</a>
</header>
<div id="stage">
  <canvas id="c" aria-label="3D 서비스 마을 지도. 요청이 3D 택배원과 검사관으로 표시됩니다. 같은 내용이 오른쪽 목록에 글로 나옵니다."></canvas>
  <div id="labels"></div>
  <div id="fx"></div>
  <div id="tip"></div>
  <div id="hud">
    <button id="theme_day" class="active">☀️ 낮</button>
    <button id="theme_sunset">🌅 황혼</button>
    <button id="theme_night">🌙 밤</button>
    <button id="cam_overview">🗺 전체 뷰</button>
    <button id="cam_gate">🛡 정문 뷰</button>
    <button id="cam_orbit">🔄 자동 회전</button>
  </div>
  <div id="hint3d">드래그: 회전 · 휠: 줌 · 우클릭: 이동</div>
</div>
<aside>
  <div>
    <h2>무슨 일이 일어나고 있나</h2>
    <div class="legend">
      <div><span style="color:var(--ok)">✓</span> 성공 · <span style="color:var(--warn)">!</span> 요청 오류(4xx) · <span style="color:var(--bad)">✗</span> 서버 오류(5xx)</div>
      <div><span>✋</span> 정문 경비가 막음(IAM 거부) · <span>⚡</span> 장애 주입(chaos)</div>
      <div><span>🛡</span> 검사관 공격 방어 성공 · <span>⚠</span> 검증 실패(경고)</div>
      <div>빛나는 구체 = 서비스 간 배달 · 보라색 모자 = 검사관</div>
    </div>
  </div>
  <ul id="log" aria-live="polite"></ul>
</aside>

<script type="importmap">
{
  "imports": {
    "three": "https://esm.sh/three@0.170.0",
    "three/addons/": "https://esm.sh/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const $ = id => document.getElementById(id);
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

// ---------- building catalog (3D layout on island) ----------
const B = [
  {id: "s3",     name: "창고",         sub: "S3",                               kind: "warehouse", color: 0xc97b36, hex: "#c97b36", svc: ["s3"],                                x: -16, z: -8.5},
  {id: "ddb",    name: "기록보관소",   sub: "DynamoDB · Kinesis",               kind: "archive",   color: 0x3b82f6, hex: "#3b82f6", svc: ["dynamodb", "kinesis"],               x: -8,  z: -8.5},
  {id: "sqs",    name: "우체국",       sub: "SQS",                              kind: "post",      color: 0xe05d38, hex: "#e05d38", svc: ["sqs"],                               x: 0,   z: -8.5},
  {id: "sns",    name: "방송탑",       sub: "SNS · SES · EventBridge",          kind: "tower",     color: 0x9333ea, hex: "#9333ea", svc: ["sns", "ses", "events"],              x: 8,   z: -8.5},
  {id: "lambda", name: "공방",         sub: "Lambda · API Gateway",             kind: "workshop",  color: 0xeab308, hex: "#eab308", svc: ["lambda", "apigateway"],              x: 16,  z: -8.5},
  {id: "sfn",    name: "조립 라인",    sub: "Step Functions",                   kind: "factory",   color: 0xec4899, hex: "#ec4899", svc: ["states"],                            x: 24,  z: -8.5},
  {id: "id",     name: "신분증 발급소", sub: "IAM · STS · Cognito",              kind: "office",    color: 0x14b8a6, hex: "#14b8a6", svc: ["iam", "sts", "cognito-idp"],         x: -12, z: 8.5},
  {id: "vault",  name: "금고",         sub: "KMS · Secrets · SSM",              kind: "vault",     color: 0x64748b, hex: "#64748b", svc: ["kms", "secretsmanager", "ssm"],      x: -4,  z: 8.5},
  {id: "harbor", name: "항구",         sub: "ECS · RDS · ElastiCache · ALB",    kind: "harbor",    color: 0x0284c7, hex: "#0284c7", svc: ["ecs", "rds", "elasticache", "elbv2"], x: 4,  z: 8.5},
  {id: "radar",  name: "관제탑",       sub: "VPC · Route 53 · Logs",            kind: "radar",     color: 0x65a30d, hex: "#65a30d", svc: ["ec2", "route53", "logs"],            x: 12,  z: 8.5},
  {id: "crane",  name: "공사장",       sub: "CloudFormation",                   kind: "crane",     color: 0xd97706, hex: "#d97706", svc: ["cloudformation"],                    x: 20,  z: 8.5},
];
const byService = {};
B.forEach(b => {
  b.count = 0; b.bounce = 0; b.act = 0; b.step = 0;
  b.door = new THREE.Vector3(b.x, 0, b.z < 0 ? b.z + 3.0 : b.z - 3.0);
  b.svc.forEach(s => byService[s] = b);
});
const GATE_X = -24.5;

// ---------- Three.js scene setup ----------
const canvas = $("c");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: "high-performance" });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.FogExp2(0x87ceeb, 0.0065);

const camera = new THREE.PerspectiveCamera(42, 1, 0.5, 300);
camera.position.set(-28, 30, 44);

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.target.set(-1, 1, 0);
controls.maxPolarAngle = Math.PI * 0.46;
controls.minDistance = 12;
controls.maxDistance = 85;

// Lights
const hemi = new THREE.HemisphereLight(0xdff6ff, 0x4d7c4f, 0.85);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xfff5e4, 1.9);
sun.position.set(28, 42, 24);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -42; sun.shadow.camera.right = 42;
sun.shadow.camera.top = 30; sun.shadow.camera.bottom = -30;
sun.shadow.camera.near = 5; sun.shadow.camera.far = 120;
sun.shadow.bias = -0.0005;
scene.add(sun);

const rimLight = new THREE.DirectionalLight(0x93c5fd, 0.45);
rimLight.position.set(-30, 18, -22);
scene.add(rimLight);

// ---------- helpers ----------
const mat = (color, rough = 0.65, metal = 0.08, extra = {}) =>
  new THREE.MeshStandardMaterial({ color, roughness: rough, metalness: metal, ...extra });

function box(w, h, d, m, x = 0, y = 0, z = 0) {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);
  mesh.position.set(x, y, z);
  mesh.castShadow = true; mesh.receiveShadow = true;
  return mesh;
}
function cyl(rt, rb, h, seg, m, x = 0, y = 0, z = 0) {
  const mesh = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), m);
  mesh.position.set(x, y, z);
  mesh.castShadow = true; mesh.receiveShadow = true;
  return mesh;
}

// ---------- ocean, island, road, trees, clouds, street lamps ----------
const waterGeo = new THREE.PlaneGeometry(360, 360, 48, 48);
waterGeo.rotateX(-Math.PI / 2);
const waterMat = new THREE.MeshStandardMaterial({ color: 0x0ea5e9, roughness: 0.22, metalness: 0.35, flatShading: true });
const water = new THREE.Mesh(waterGeo, waterMat);
water.position.y = -1.6;
water.receiveShadow = true;
scene.add(water);
const waterBaseY = Float32Array.from(waterGeo.attributes.position.array);

// Island base (layered stone + lush grass)
scene.add(box(66, 2.2, 34, mat(0x78716c, 0.9, 0.02), 0, -1.35, 0));
scene.add(box(64.5, 0.6, 32.5, mat(0x65a30d, 0.85, 0.0), 0, -0.2, 0));

// Main avenue + curbs + lane dashes
scene.add(box(64, 0.14, 5.2, mat(0x334155, 0.85, 0.05), 0, 0.12, 0));
scene.add(box(64, 0.18, 0.45, mat(0xcbd5e1, 0.7), 0, 0.15, -2.75));
scene.add(box(64, 0.18, 0.45, mat(0xcbd5e1, 0.7), 0, 0.15, 2.75));
const dashMat = mat(0xfef08a, 0.5);
for (let x = -29; x <= 29; x += 3.2) {
  scene.add(box(1.6, 0.04, 0.18, dashMat, x, 0.21, 0));
}

// Sidewalks to every building
const walkMat = mat(0x94a3b8, 0.8);
B.forEach(b => {
  const len = Math.abs(b.door.z) - 2.6;
  scene.add(box(1.8, 0.1, len, walkMat, b.x, 0.12, b.z < 0 ? -2.6 - len / 2 : 2.6 + len / 2));
});

// Street lamps (glow in sunset/night)
const lampBulbs = [];
const lampLights = [];
const poleMat = mat(0x1e293b, 0.4, 0.7);
for (const lx of [-20, -10, 0, 10, 20]) {
  for (const lz of [-3.3, 3.3]) {
    const g = new THREE.Group();
    g.position.set(lx, 0.1, lz);
    g.add(cyl(0.08, 0.12, 3.4, 8, poleMat, 0, 1.7, 0));
    g.add(box(0.55, 0.1, 0.12, poleMat, 0, 3.4, lz < 0 ? 0.25 : -0.25));
    const bm = new THREE.MeshStandardMaterial({ color: 0xfffbeb, emissive: 0xfde68a, emissiveIntensity: 0.1, roughness: 0.2 });
    const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.2, 10, 10), bm);
    bulb.position.set(0, 3.28, lz < 0 ? 0.45 : -0.45);
    g.add(bulb);
    lampBulbs.push(bm);
    if (lx % 20 === 0) {
      const pl = new THREE.PointLight(0xfde68a, 0, 14, 1.5);
      pl.position.set(lx, 3.1, lz < 0 ? lz + 0.5 : lz - 0.5);
      scene.add(pl);
      lampLights.push(pl);
    }
    scene.add(g);
  }
}

// 3D Trees around the island perimeter
const trunkMat = mat(0x7c4a2d, 0.9);
const leafMats = [mat(0x15803d, 0.8), mat(0x16a34a, 0.8), mat(0x22c55e, 0.8)];
const treeCoords = [
  [-28,-13],[-24,-13.5],[-19,-13.5],[-11,-13.8],[-3,-13.5],[5,-13.8],[13,-13.5],[21,-13.8],[28,-13],
  [-28,13],[-22,13.5],[-16,13.2],[-8,13.8],[0,13.5],[8,13.8],[16,13.2],[25,13.5],[29,12],
  [-29,-5],[-29,5],[29,-4],[29,5]
];
treeCoords.forEach(([tx, tz], i) => {
  const tg = new THREE.Group();
  tg.position.set(tx, 0.1, tz);
  const sc = 0.85 + (i % 4) * 0.18;
  tg.scale.setScalar(sc);
  tg.add(cyl(0.18, 0.26, 1.4, 6, trunkMat, 0, 0.7, 0));
  const lm = leafMats[i % leafMats.length];
  if (i % 2 === 0) {
    // Pine tree
    const c1 = new THREE.Mesh(new THREE.ConeGeometry(1.15, 2.2, 7), lm);
    c1.position.y = 2.1; c1.castShadow = true; tg.add(c1);
    const c2 = new THREE.Mesh(new THREE.ConeGeometry(0.85, 1.8, 7), lm);
    c2.position.y = 3.2; c2.castShadow = true; tg.add(c2);
  } else {
    // Broadleaf tree
    const s1 = new THREE.Mesh(new THREE.DodecahedronGeometry(1.1, 0), lm);
    s1.position.y = 2.2; s1.castShadow = true; tg.add(s1);
  }
  scene.add(tg);
});

// Fluffy drifting clouds (high in the background sky so they never block buildings)
const clouds = [];
const cloudMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.9, metalness: 0.0, transparent: true, opacity: 0.85 });
for (let i = 0; i < 8; i++) {
  const cg = new THREE.Group();
  for (let j = 0; j < 4; j++) {
    const p = new THREE.Mesh(new THREE.DodecahedronGeometry(1.1 + (j % 2) * 0.45, 1), cloudMat);
    p.position.set((j - 1.5) * 1.0, (j % 2) * 0.35, (j % 3 - 1) * 0.4);
    cg.add(p);
  }
  cg.position.set(-48 + i * 14, 24 + (i % 3) * 3.0, -28 - (i % 3) * 7);
  scene.add(cg);
  clouds.push(cg);
}

// Starfield (visible at night)
const starPos = new Float32Array(300 * 3);
for (let i = 0; i < 300; i++) {
  starPos[i * 3] = (Math.random() - 0.5) * 200;
  starPos[i * 3 + 1] = 28 + Math.random() * 55;
  starPos[i * 3 + 2] = -30 - Math.random() * 90;
}
const starGeo = new THREE.BufferGeometry();
starGeo.setAttribute("position", new THREE.BufferAttribute(starPos, 3));
const starMat = new THREE.PointsMaterial({ color: 0xfef9c3, size: 0.55, transparent: true, opacity: 0.0 });
scene.add(new THREE.Points(starGeo, starMat));

// ---------- Gate (IAM) + Barrier + 3D Guard ----------
const gateGroup = new THREE.Group();
gateGroup.position.set(GATE_X, 0.1, 0);
const stoneMat = mat(0x94a3b8, 0.8);
const roofGateMat = mat(0x334155, 0.6);
gateGroup.add(box(1.1, 4.4, 1.1, stoneMat, 0, 2.2, -3.4));
gateGroup.add(box(1.1, 4.4, 1.1, stoneMat, 0, 2.2, 3.4));
gateGroup.add(box(1.4, 1.0, 8.2, roofGateMat, 0, 4.7, 0));
// Security booth next to gate
gateGroup.add(box(2.0, 2.6, 1.8, mat(0x1e3a5f, 0.6), 1.4, 1.3, -4.4));
gateGroup.add(box(2.3, 0.3, 2.1, mat(0x0f172a, 0.5), 1.4, 2.75, -4.4));
// Barrier arm (pivots up/down)
const barrierPivot = new THREE.Group();
barrierPivot.position.set(0.6, 1.2, -2.7);
const barMesh = box(0.18, 0.18, 5.2, mat(0xef4444, 0.4), 0, 0, 2.6);
barrierPivot.add(barMesh);
for (let k = 0; k < 5; k++) barrierPivot.add(box(0.2, 0.2, 0.45, mat(0xffffff, 0.4), 0, 0, 0.6 + k * 1.0));
gateGroup.add(barrierPivot);
// Beacon on gate
const beaconMat = new THREE.MeshStandardMaterial({ color: 0x22c55e, emissive: 0x22c55e, emissiveIntensity: 0.6 });
const beacon = new THREE.Mesh(new THREE.SphereGeometry(0.28, 12, 12), beaconMat);
beacon.position.set(0, 5.4, 0);
gateGroup.add(beacon);
scene.add(gateGroup);

// 3D Guard character
function buildCharacter(coatColor, isGuard = false, isInspector = false) {
  const g = new THREE.Group();
  const coat = mat(coatColor, 0.55);
  const skin = mat(0xf3c69f, 0.6);
  const dark = mat(0x1e293b, 0.7);
  // Legs
  const legL = box(0.26, 0.65, 0.26, dark, -0.17, 0.32, 0);
  const legR = box(0.26, 0.65, 0.26, dark, 0.17, 0.32, 0);
  g.add(legL, legR);
  // Torso
  const body = box(0.72, 0.9, 0.46, coat, 0, 1.08, 0);
  g.add(body);
  // Head

};
function story(e) {
  if (e.service === "inspector") {
    if (e.op === "RunStarted") return `검사관: 마을 보안·안정성 순찰을 시작했습니다 (${e.total || 0}건)`;
    if (e.op === "RunFinished") return `검사관: 순찰 완료 — 통과 ${e.passed}/${e.total}${e.failed ? ` (실패 ${e.failed})` : ""}`;
    if (e.blocked && e.passed) return `검사관 → ${(byService[e.target_service] || {name: "정문"}).name}: ${e.name} — 경비가 막아 방어 성공`;
    return `검사관 → ${(byService[e.target_service] || {name: e.target_service || "마을"}).name}: ${e.name} (${e.passed ? "통과" : "실패!"})`;
  }
  const verb = VERBS[e.op] || `${e.op} 처리`;
  const who = e.principal && !/:root$/.test(e.principal) ? e.principal.replace(/^arn:aws:(iam|sts)::\d+:/, "") + " — " : "";
  const tgt = e.target ? ` (${String(e.target).replace(/^arn:aws:[^:]+:[^:]*:\d*:/, "").slice(0, 40)})` : "";
  return `${who}${(byService[e.service] || {name: e.service}).name}: ${verb}${tgt}`;
}
function outcome(e) {
  if (e.service === "inspector") {
    if (e.op === "ScenarioDone") return e.passed ? (e.blocked ? "defend" : "ok") : "breach";
    return e.status >= 400 ? "breach" : "ok";
  }
  if (e.auth && e.auth.decision !== "allowed" && e.auth.enforced) return "deny";
  if (e.chaos && e.chaos.fault) return "zap";
  if (e.status >= 500 && e.status !== 299) return "bad";
  if (e.status >= 400) return "warn";
  return "ok";
}
function origin(e) {
  const from = e.trigger || (e.op === "Deliver" ? e.service : null);
  return from && byService[from] ? byService[from] : null;
}
function destination(e) {
  if (e.service === "inspector") return e.op === "ScenarioDone" ? (byService[e.target_service] || B[0]) : null;
  if (e.op === "Deliver") return (e.protocol === "lambda" || /:lambda:/.test(e.target || "")) ? byService.lambda : byService.sqs;
  return byService[e.service];
}

function buildPath(from, to, blockedAtGate) {
  if (blockedAtGate) {
    return [new THREE.Vector3(-31, 0.2, 0), new THREE.Vector3(GATE_X - 1.4, 0.2, 0)];
  }
  const pts = [];
  if (from) {
    pts.push(new THREE.Vector3(from.door.x, 0.2, from.door.z));
    pts.push(new THREE.Vector3(from.door.x, 0.2, 0));
  } else {
    pts.push(new THREE.Vector3(-31, 0.2, 0));
  }
  pts.push(new THREE.Vector3(to.door.x, 0.2, 0));
  pts.push(new THREE.Vector3(to.door.x, 0.2, to.door.z));
  return pts;
}

function spawn(e) {
  const to = destination(e);
  if (!to) return;
  const from = origin(e);
  const out = outcome(e);
  if (walkers.length > 45) { land(to, out, e); return; }
  const blocked = out === "deny" || out === "defend";
  const pts = buildPath(from, to, blocked);
  let len = 0;
  for (let i = 1; i < pts.length; i++) len += pts[i].distanceTo(pts[i - 1]);
  const isInsp = e.service === "inspector";
  let mesh;
  if (from) {
    // Internal service-to-service delivery: glowing energy orb
    const g = new THREE.Group();
    const c = (byService[e.service] || to).color;
    const orb = new THREE.Mesh(new THREE.OctahedronGeometry(0.45, 1), new THREE.MeshStandardMaterial({ color: c, emissive: c, emissiveIntensity: 0.9, roughness: 0.2 }));
    orb.position.y = 1.1; g.add(orb);
    mesh = g;
  } else {
    mesh = buildCharacter(isInsp ? 0x6b21a8 : (byService[e.service] || to).color, false, isInsp);
    if (out === "zap") {
      const p = mesh.getObjectByName("parcel");
      if (p) p.material = mat(0xfacc15, 0.3, 0.2, { emissive: 0xfacc15, emissiveIntensity: 0.6 });
    }
  }
  mesh.position.copy(pts[0]);
  scene.add(mesh);
  walkers.push({
    mesh, pts, len, t: 0, dur: reduce ? 0.05 : Math.max(0.85, len / 14),
    to, from, out, e, internal: !!from, inspector: isInsp, leaving: false, done: false,
  });
}

function land(b, out, e) {
  b.count++;
  b.cntEl.textContent = b.count > 999 ? "999+" : b.count;
  b.bounce = 1;
  b.act = 1;
  if (e.service === "states" && e.op === "StateEntered") b.step = (b.step || 0) + 1;
  const col = OUT_COLORS[out] || 0x34d399;
  b.mesh.userData.glowMat.color.setHex(col);
  b.mesh.userData.glowMat.opacity = 0.85;
  spawnRing(b.x, b.z, col, 5.2);
  spawnPop(new THREE.Vector3(b.x, 5.8, b.z), out);
}

// ---------- theme & camera controls ----------
const THEMES = {
  day:    { bg: 0x87ceeb, fog: 0x87ceeb, fogD: 0.006, sunC: 0xfff5e4, sunI: 1.9, sunP: [28, 42, 24], hemiSky: 0xdff6ff, hemiGnd: 0x4d7c4f, hemiI: 0.85, winE: 0.08, lampI: 0, lampE: 0.1, water: 0x0ea5e9 },
  sunset: { bg: 0xf97316, fog: 0xfb923c, fogD: 0.0085, sunC: 0xffedd5, sunI: 1.6, sunP: [-38, 14, 18], hemiSky: 0xfdba74, hemiGnd: 0x3b2f4a, hemiI: 0.65, winE: 0.75, lampI: 1.6, lampE: 1.4, water: 0x0369a1 },
  night:  { bg: 0x0b1530, fog: 0x0b1530, fogD: 0.009, sunC: 0x93c5fd, sunI: 0.72, sunP: [-20, 32, -20], hemiSky: 0x334155, hemiGnd: 0x1e293b, hemiI: 0.65, winE: 1.5, lampI: 4.0, lampE: 2.4, water: 0x0c3454 },
};
function setTheme(name) {
  const th = THEMES[name];
  scene.background.setHex(th.bg);
  scene.fog.color.setHex(th.fog); scene.fog.density = th.fogD;
  sun.color.setHex(th.sunC); sun.intensity = th.sunI; sun.position.set(...th.sunP);
  hemi.color.setHex(th.hemiSky); hemi.groundColor.setHex(th.hemiGnd); hemi.intensity = th.hemiI;
  waterMat.color.setHex(th.water);
  windowMats.forEach(m => m.emissiveIntensity = th.winE);
  lampBulbs.forEach(m => m.emissiveIntensity = th.lampE);
  lampLights.forEach(l => l.intensity = th.lampI);
  starMat.opacity = name === "night" ? 0.9 : name === "sunset" ? 0.25 : 0.0;
  ["day", "sunset", "night"].forEach(k => $("theme_" + k).classList.toggle("active", k === name));
}
$("theme_day").onclick = () => setTheme("day");
$("theme_sunset").onclick = () => setTheme("sunset");
$("theme_night").onclick = () => setTheme("night");

let camGoal = null;
function flyTo(pos, target) { camGoal = { pos: new THREE.Vector3(...pos), target: new THREE.Vector3(...target), t: 0 }; }
$("cam_overview").onclick = () => { controls.autoRotate = false; $("cam_orbit").classList.remove("active"); flyTo([-28, 30, 44], [-1, 1, 0]); };
$("cam_gate").onclick = () => { controls.autoRotate = false; $("cam_orbit").classList.remove("active"); flyTo([-34, 9, 13], [GATE_X + 1, 1.5, 0]); };

// ---------- raycast hover tooltip ----------
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2(-9, -9);
let hovered = null;
canvas.addEventListener("mousemove", ev => {
  const r = canvas.getBoundingClientRect();
  mouse.x = ((ev.clientX - r.left) / r.width) * 2 - 1;
  mouse.y = -((ev.clientY - r.top) / r.height) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(clickTargets, false);
  const b = hits.length ? hits[0].object.userData.building : null;
  if (hovered && hovered !== b) hovered.labelEl.classList.remove("hot");
  hovered = b;
  const tip = $("tip");
  if (!b) { tip.style.display = "none"; return; }
  b.labelEl.classList.add("hot");
  tip.innerHTML = `<b>${b.name}</b> <span style="color:#94a3b8">${b.sub}</span><br>누적 처리: <b>${b.count}건</b>`;
  tip.style.display = "block";
  tip.style.left = Math.min(r.width - 230, ev.clientX - r.left + 14) + "px";
  tip.style.top = Math.max(10, ev.clientY - r.top + 14) + "px";
});
canvas.addEventListener("mouseleave", () => {
  if (hovered) hovered.labelEl.classList.remove("hot");
  hovered = null; $("tip").style.display = "none";
});

// ---------- resize & animation loop ----------
function resize() {
  const r = $("stage").getBoundingClientRect();
  if (!r.width || !r.height) return;
  camera.aspect = r.width / r.height;
  camera.updateProjectionMatrix();
  renderer.setSize(r.width, r.height, false);
}
addEventListener("resize", resize);
resize();

const tmpV = new THREE.Vector3();
function projectToScreen(v) {
  tmpV.copy(v).project(camera);
  const r = $("stage").getBoundingClientRect();
  return { x: (tmpV.x * 0.5 + 0.5) * r.width, y: (-tmpV.y * 0.5 + 0.5) * r.height, visible: tmpV.z < 1 };
}

let last = performance.now(), clock = 0;
function animate(now) {
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, (now - last) / 1000) * (paused ? 0 : speed);
  last = now; clock += dt;

  // Smooth camera preset fly-to
  if (camGoal) {
    camera.position.lerp(camGoal.pos, 0.09);
    controls.target.lerp(camGoal.target, 0.09);
    if (camera.position.distanceTo(camGoal.pos) < 0.25) camGoal = null;
  }
  controls.update();

  // Gentle ocean waves & drifting clouds
  if (!reduce) {
    const pos = waterGeo.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      const x = waterBaseY[i * 3], z = waterBaseY[i * 3 + 2];
      pos.setY(i, Math.sin(x * 0.12 + clock * 1.3) * 0.18 + Math.cos(z * 0.14 + clock) * 0.15);
    }
    pos.needsUpdate = true;
    clouds.forEach((c, i) => { c.position.x += dt * (0.45 + (i % 3) * 0.15); if (c.position.x > 55) c.position.x = -55; });
  }

  // Update buildings (bounce + unique 3D animations)
  for (const b of B) {
    b.bounce = Math.max(0, b.bounce - dt * 2.5);
    b.act = Math.max(0, b.act - dt * 0.7);
    const s = 1 + Math.sin(b.bounce * Math.PI) * 0.1;
    b.mesh.scale.set(1 / Math.sqrt(s), s, 1 / Math.sqrt(s));
    const gm = b.mesh.userData.glowMat;
    if (gm.opacity > 0.01) gm.opacity = Math.max(0, gm.opacity - dt * 0.9);
    const a = b.mesh.userData.anim;
    if (a.spin) a.spin.rotation.y += dt * (0.9 + b.act * 3.5);
    if (a.gear) a.gear.rotation.z -= dt * (1.2 + b.act * 5.0);
    if (a.wheel) a.wheel.rotation.z += dt * (b.act * 4.5);
    if (a.bob) a.bob.position.y = 4.35 + Math.sin(clock * 2.5 + b.x) * 0.18;
    if (a.wave) {
      const k = (clock * (0.7 + b.act * 1.2)) % 1;
      a.wave.scale.setScalar(0.5 + k * 2.8);
      a.wave.material.opacity = (1 - k) * (0.35 + b.act * 0.65);
    }
    if (a.lift) a.lift.position.y = (b.kind === "harbor" ? 2.35 : 1.42) + Math.sin(b.act * Math.PI) * 0.65;
    if (a.lamps) a.lamps.forEach((lm, i) => lm.emissiveIntensity = (b.step % 4 === i && b.act > 0.05) ? 1.8 : 0.15);
    if (a.jib) a.jib.rotation.y = Math.sin(clock * 0.4) * 0.45;
    if (a.hook) a.hook.position.y = -2.2 + Math.sin(clock * (0.8 + b.act * 2.5)) * 0.9;
  }

  // Gate barrier & 3D Guard animation
  guardState.block = Math.max(0, guardState.block - dt);
  guardState.pass = Math.max(0, guardState.pass - dt * 1.4);
  const targetAngle = guardState.pass > 0.05 ? -Math.PI * 0.42 : 0;
  barrierPivot.rotation.x += (targetAngle - barrierPivot.rotation.x) * 0.18;
  beaconMat.color.setHex(guardState.block > 0.05 ? 0xef4444 : 0x22c55e);
  beaconMat.emissive.setHex(guardState.block > 0.05 ? 0xef4444 : 0x22c55e);
  guardMesh.userData.armL.rotation.x = -guardState.block * 2.6;
  guardMesh.userData.armR.rotation.x = -guardState.pass * 1.4;

  // Update 3D walkers
  for (let i = walkers.length - 1; i >= 0; i--) {
    const w = walkers[i];
    w.t += dt;
    const frac = Math.min(1, w.t / w.dur);
    let d = w.len * frac;
    let cur = w.pts[w.pts.length - 1], dir = new THREE.Vector3(1, 0, 0);
    for (let j = 1; j < w.pts.length; j++) {
      const seg = w.pts[j].distanceTo(w.pts[j - 1]);
      if (d <= seg) {
        cur = new THREE.Vector3().lerpVectors(w.pts[j - 1], w.pts[j], seg ? d / seg : 0);
        dir.subVectors(w.pts[j], w.pts[j - 1]).normalize();
        break;
      }
      d -= seg;
    }
    w.mesh.position.copy(cur);
    if (!w.internal) {
      w.mesh.rotation.y = Math.atan2(dir.x, dir.z);
      const sw = reduce ? 0 : Math.sin(clock * 14 + i) * 0.65;
      w.mesh.userData.legL.rotation.x = sw;
      w.mesh.userData.legR.rotation.x = -sw;
      w.mesh.userData.armL.rotation.x = -sw * 0.7;
      if (!w.inspector) w.mesh.userData.armR.rotation.x = sw * 0.7;
      w.mesh.position.y = 0.2 + Math.abs(Math.sin(clock * 14 + i)) * 0.12;
      if (!w.leaving && Math.abs(cur.x - GATE_X) < 3.0 && w.out !== "deny" && w.out !== "defend") guardState.pass = 1;
    } else {
      w.mesh.rotation.y += dt * 4;
      w.mesh.position.y = 0.2 + Math.sin(clock * 8 + i) * 0.2;
    }
    if (w.t >= w.dur && !w.done) {
      if ((w.out === "deny" || w.out === "defend") && !w.leaving) {
        guardState.block = 1;
        spawnRing(GATE_X, 0, OUT_COLORS[w.out], 4.8);
        spawnPop(new THREE.Vector3(GATE_X, 4.2, 0), w.out);
        w.pts = [w.pts[1], new THREE.Vector3(-31, 0.2, 0)];
        w.len = w.pts[0].distanceTo(w.pts[1]);
        w.t = 0; w.dur = 0.9; w.leaving = true;
      } else {
        w.done = true;
        if (!w.leaving) land(w.to, w.out, w.e);
        scene.remove(w.mesh);
        walkers.splice(i, 1);
      }
    }
  }

  // Expanding 3D pulse rings
  for (let i = rings.length - 1; i >= 0; i--) {
    const r = rings[i];
    r.life += dt * 1.4;
    r.mesh.scale.setScalar(1 + r.life * r.maxR);
    r.mat.opacity = Math.max(0, 0.9 * (1 - r.life));
    if (r.life >= 1) { scene.remove(r.mesh); r.mesh.geometry.dispose(); r.mat.dispose(); rings.splice(i, 1); }
  }

  // Project HTML labels & popups onto 3D positions
  for (const b of B) {
    const p = projectToScreen(new THREE.Vector3(b.x, b.kind === "tower" ? 7.8 : b.kind === "crane" ? 7.1 : 5.4, b.z));
    b.labelEl.style.display = p.visible ? "flex" : "none";
    b.labelEl.style.left = p.x + "px"; b.labelEl.style.top = p.y + "px";
  }
  const gp = projectToScreen(new THREE.Vector3(GATE_X, 6.2, 0));
  gateLabel.style.display = gp.visible ? "flex" : "none";
  gateLabel.style.left = gp.x + "px"; gateLabel.style.top = gp.y + "px";

  for (let i = pops.length - 1; i >= 0; i--) {
    const pp = pops[i];
    pp.life -= dt;
    pp.pos.y += dt * 1.6;
    const sc = projectToScreen(pp.pos);
    pp.el.style.left = sc.x + "px"; pp.el.style.top = sc.y + "px";
    pp.el.style.opacity = Math.max(0, Math.min(1, pp.life));
    if (pp.life <= 0) { pp.el.remove(); pops.splice(i, 1); }
  }

  renderer.render(scene, camera);
}
requestAnimationFrame(animate);

// ---------- caption log & SSE / demo ----------
function caption(e) {
  const li = document.createElement("li");
  const out = outcome(e);
  li.className = out;
  const t = new Date(e.ts || Date.now());
  li.innerHTML = `<span class="t">${t.toTimeString().slice(0, 8)}</span>`;
  li.append(document.createTextNode(story(e) + (out === "deny" ? " — 정문에서 막혔습니다" : out === "zap" ? " — 장애 주입" : "")));
  if (e.auth && e.auth.decision !== "allowed") li.title = e.auth.reason || "";
  const log = $("log");
  log.prepend(li);
  while (log.children.length > 120) log.lastChild.remove();
}
function handle(e) {
  if (e.service === "admin") { caption({...e, op: e.op === "Reset" ? "전체 초기화" : e.op}); return; }
  if (paused) return;
  spawn(e);
  caption(e);
}

let es = null, demoTimer = null;
function setMode(kind, text) { $("dot").className = "dot " + kind; $("mode").textContent = text; }
function live() {
  stopDemo();
  es = new EventSource("/_events");
  let opened = false;
  es.onopen = () => { opened = true; setMode("live", "실시간 연결됨"); };
  es.onmessage = m => { try { handle(JSON.parse(m.data)); } catch {} };
  es.onerror = () => { if (es.readyState === 2 || !opened) startDemo("에뮬레이터에 연결할 수 없어 3D 데모를 보여 줍니다"); };
}

function startDemo(why) {
  if (es) { es.close(); es = null; }
  setMode("demo", why || "3D 데모 모드");
  $("demo").textContent = "실시간 보기";
  let i = 0;
  clearInterval(demoTimer);
  const tick = () => {
    if (paused) return;
    SCRIPT[i % SCRIPT.length].forEach((e, k) => setTimeout(() => handle({ts: new Date().toISOString(), principal: "arn:aws:iam::0:root", ...e}), k * 250));
    i++;
  };
  tick();
  demoTimer = setInterval(tick, 1150);
}
function stopDemo() { clearInterval(demoTimer); demoTimer = null; $("demo").textContent = "데모 보기"; }

$("demo").onclick = () => demoTimer ? live() : startDemo("3D 데모 모드");
$("pause").onclick = () => { paused = !paused; $("pause").textContent = paused ? "다시 재생" : "일시정지"; };
$("speed").oninput = e => speed = +e.target.value;

if (location.protocol.startsWith("http") && !new URLSearchParams(location.search).has("demo") && location.pathname.startsWith("/_town")) live();
else { $("gui").hidden = true; startDemo("3D 데모 모드 (목업 데이터)"); }
