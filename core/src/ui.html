<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rocalcloud</title>
<style>
:root {
  --bg: #f6f6f3; --panel: #ffffff; --line: #e2e1dc; --text: #1d1d1b; --muted: #77766f;
  --accent: #2f6f5e; --ok: #2f7d4f; --warn: #b36b00; --bad: #b3261e; --sel: #e8efe9;
  --ddb: #3b5bdb; --s3: #2b8a3e; --sqs: #c2410c; --admin: #6b6b6b;
  font: 13px/1.45 ui-sans-serif, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #151614; --panel: #1d1e1b; --line: #30312d; --text: #e9e8e3; --muted: #9a998f;
          --accent: #7cc4ad; --sel: #263129; --ddb: #8ea4ff; --s3: #6fcf86; --sqs: #ff9a5c; }
}
* { box-sizing: border-box; }
body { margin: 0; height: 100vh; display: grid; grid-template-rows: 44px 1fr 38%; background: var(--bg); color: var(--text); }
header { display: flex; align-items: center; gap: 14px; padding: 0 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
header b { font-size: 14px; letter-spacing: .02em; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--bad); display: inline-block; margin-right: 6px; }
.dot.on { background: var(--ok); }
.spacer { flex: 1; }
.muted { color: var(--muted); }
button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
button:hover { border-color: var(--muted); }
button.danger { color: var(--bad); }
main { display: grid; grid-template-columns: 240px 1fr; min-height: 0; }
nav { border-right: 1px solid var(--line); overflow: auto; padding: 8px 0; background: var(--panel); }
nav h3 { margin: 12px 16px 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
nav a { display: flex; justify-content: space-between; padding: 4px 16px; color: inherit; text-decoration: none; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
nav a:hover { background: var(--bg); }
nav a.sel { background: var(--sel); font-weight: 600; }
nav .empty { padding: 2px 16px; color: var(--muted); font-size: 12px; }
#detail { overflow: auto; padding: 16px 20px; min-width: 0; }
#detail h2 { margin: 0 0 4px; font-size: 16px; }
.sub { color: var(--muted); margin-bottom: 12px; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 4px 10px 4px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-weight: 600; color: var(--muted); font-size: 12px; position: sticky; top: 0; background: var(--bg); }
td.v { font-family: ui-monospace, Menlo, monospace; font-size: 12px; max-width: 420px; overflow-wrap: anywhere; white-space: pre-line; }
section#log { border-top: 1px solid var(--line); display: grid; grid-template-rows: 36px 1fr; min-height: 0; background: var(--panel); }
.logbar { display: flex; align-items: center; gap: 12px; padding: 0 16px; border-bottom: 1px solid var(--line); }
.logbar input[type=search] { font: inherit; padding: 3px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--text); width: 220px; }
#logwrap { overflow: auto; padding: 0 16px; }
#logwrap td { padding: 2px 12px 2px 0; font-family: ui-monospace, Menlo, monospace; font-size: 12px; white-space: nowrap; }
.svc { font-weight: 600; }
.svc.dynamodb { color: var(--ddb); } .svc.s3 { color: var(--s3); } .svc.sqs { color: var(--sqs); } .svc.admin { color: var(--admin); }
.st2 { color: var(--ok); } .st4 { color: var(--warn); } .st5 { color: var(--bad); }
.hint { color: var(--muted); padding: 40px 0; text-align: center; }
h4 { margin: 20px 0 6px; font-size: 13px; }
pre { margin: 4px 0 10px; padding: 8px 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; font-size: 12px; overflow: auto; }
.reach { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 6px 0 10px; }
.reach select, .reach input { font: inherit; padding: 3px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--text); }
.reach input { width: 80px; }
.hop { padding: 3px 0; font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
.hop.ok::before { content: "✓ "; color: var(--ok); } .hop.no::before { content: "✗ "; color: var(--bad); }
.verdict { font-weight: 600; margin: 6px 0; } .verdict.ok { color: var(--ok); } .verdict.no { color: var(--bad); }
.deny { color: var(--bad); } .allow { color: var(--ok); }
.svc.iam, .svc.sts, .svc.kms, .svc.secretsmanager { color: var(--warn); } .svc.ec2, .svc.ssm { color: var(--accent); }
.svc.sns, .svc.logs { color: var(--sqs); } .svc.lambda { color: var(--ddb); }
</style>
</head>
<body>
<header>
  <b>rocalcloud</b>
  <span><span id="dot" class="dot"></span><span id="conn" class="muted">연결 중</span></span>
  <span class="muted" id="counter">요청 0</span>
  <span class="spacer"></span>
  <a href="/_town" style="color:inherit">마을 보기</a>
  <button id="refresh">새로고침</button>
  <button id="reset" class="danger">전체 초기화</button>
</header>
<main>
  <nav id="nav"></nav>
  <div id="detail"><div class="hint">왼쪽에서 리소스를 고르세요.</div></div>
</main>
<section id="log">
  <div class="logbar">
    <b>실시간 요청</b>
    <input id="filter" type="search" placeholder="필터 (서비스, 작업, 상태)">
    <label><input id="pause" type="checkbox"> 일시정지</label>
    <span class="spacer"></span>
    <button id="clear">지우기</button>
  </div>
  <div id="logwrap"><table><thead><tr><th>시각</th><th>서비스</th><th>작업</th><th>상태</th><th>권한</th><th>ms</th><th>주체</th></tr></thead><tbody id="logbody"></tbody></table></div>
</section>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let state = {dynamodb: [], s3: [], sqs: [], iam: {users: [], roles: [], policies: []}, vpc: []}, sel = null, count = 0;
const reachForm = {from: "internet", to: "", protocol: "tcp", port: "443", result: null};
// Services whose admin view is {name, count, sub, cols, rows} render with one generic table.
const GENERIC = [["sns", "SNS 토픽"], ["secrets", "Secrets Manager"], ["ssm", "SSM 파라미터"], ["kms", "KMS 키"], ["logs", "CloudWatch 로그 그룹"], ["lambda", "Lambda 함수"], ["events", "EventBridge 규칙"], ["sfn", "Step Functions"], ["apigw", "API Gateway"], ["cognito", "Cognito 사용자 풀"], ["kinesis", "Kinesis 스트림"], ["ses", "SES 메일"], ["managed", "RDS · ElastiCache"], ["ecs", "ECS 클러스터"], ["elb", "로드 밸런서"], ["route53", "Route 53 존"], ["cfn", "CloudFormation 스택"]];
const lists = () => Object.assign({dynamodb: state.dynamodb, s3: state.s3, sqs: state.sqs, iamuser: state.iam.users, iamrole: state.iam.roles, vpc: state.vpc},
  Object.fromEntries(GENERIC.map(([k]) => [k, state[k] || []])));
const policyCount = r => r.attached.length + Object.keys(r.inline).length;
const events = [];
const MAX_LOG = 500;

// DynamoDB attribute value → short display text.
function av(v) {
  if (!v || typeof v !== "object") return "";
  const [t, x] = Object.entries(v)[0] || [];
  if (t === "S" || t === "N" || t === "B") return x;
  if (t === "BOOL") return String(x);
  if (t === "NULL") return "null";
  return t + " " + JSON.stringify(x);
}

function renderNav() {
  const L = lists();
  const sec = (svc, title) => `<h3>${title}</h3>` + (L[svc].length
    ? L[svc].map(r => `<a data-svc="${svc}" data-name="${esc(r.name)}" class="${sel && sel.svc === svc && sel.name === r.name ? "sel" : ""}">
        <span>${esc(r.name)}</span><span class="muted">${r.count ?? policyCount(r)}</span></a>`).join("")
    : `<div class="empty">없음</div>`);
  $("nav").innerHTML = sec("dynamodb", "DynamoDB 테이블") + sec("s3", "S3 버킷") + sec("sqs", "SQS 큐")
    + GENERIC.map(([k, t]) => sec(k, t)).join("")
    + sec("iamuser", "IAM 사용자") + sec("iamrole", "IAM 역할") + sec("vpc", "VPC");
}

function table(cols, rows) {
  if (!rows.length) return `<div class="hint">비어 있습니다.</div>`;
  return `<table><thead><tr>${cols.map(c => `<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>` +
    rows.map(r => `<tr>${r.map(v => `<td class="v">${esc(v)}</td>`).join("")}</tr>`).join("") + `</tbody></table>`;
}

function renderDetail() {
  const r = sel && (lists()[sel.svc] || []).find(x => x.name === sel.name);
  if (!r) { $("detail").innerHTML = `<div class="hint">왼쪽에서 리소스를 고르세요.</div>`; return; }
  const more = r.count > 100 ? ` · 앞의 100개만 표시` : "";
  let body;
  if (sel.svc === "dynamodb") {
    const cols = [...r.keys];
    r.items.forEach(i => Object.keys(i).forEach(k => cols.includes(k) || cols.push(k)));
    body = `<div class="sub">키: ${esc(r.keys.join(", "))} · 항목 ${r.count}개${more}</div>` + table(cols, r.items.map(i => cols.map(c => av(i[c]))));
  } else if (sel.svc === "s3") {
    body = `<div class="sub">객체 ${r.count}개${more}</div>` + table(["키", "크기", "타입", "수정 시각"], r.objects.map(o => [o.key, o.size, o.type, o.modified]));
  } else if (r.cols) {
    body = (r.sub ? `<div class="sub">${esc(r.sub)}</div>` : "") + table(r.cols, r.rows);
  } else if (sel.svc === "iamuser" || sel.svc === "iamrole") {
    const doc = d => `<pre>${esc(JSON.stringify(d, null, 2))}</pre>`;
    const pol = a => (state.iam.policies.find(p => p.arn === a) || {}).document;
    body = `<div class="sub">${esc(r.arn)}</div>`
      + (sel.svc === "iamuser" ? `<h4>액세스 키</h4>${r.keys.length ? r.keys.map(k => `<div class="hop">${esc(k)}</div>`).join("") : `<div class="muted">없음</div>`}` : `<h4>신뢰 정책 (누가 이 역할을 맡을 수 있나)</h4>${doc(r.trust)}`)
      + `<h4>연결된 관리형 정책</h4>` + (r.attached.length ? r.attached.map(a => `<div class="muted">${esc(a)}</div>${doc(pol(a))}`).join("") : `<div class="muted">없음</div>`)
      + `<h4>인라인 정책</h4>` + (Object.keys(r.inline).length ? Object.entries(r.inline).map(([n, d]) => `<div class="muted">${esc(n)}</div>${doc(d)}`).join("") : `<div class="muted">없음</div>`);
  } else if (sel.svc === "vpc") {
    const ends = ["internet", ...r.instances.filter(i => i.state === "running").map(i => i.id)];
    if (!ends.includes(reachForm.to)) reachForm.to = ends[1] || "";
    const opt = v => ends.map(e => `<option ${e === v ? "selected" : ""}>${esc(e)}</option>`).join("");
    const res = reachForm.result;
    body = `<div class="sub">CIDR ${esc(r.cidr)} · 실행 중 인스턴스 ${r.count}개 · NACL·피어링·NAT는 아직 모델링하지 않습니다</div>`
      + `<h4>도달성 판정</h4><div class="reach"><select id="rf">${opt(reachForm.from)}</select> → <select id="rt">${opt(reachForm.to)}</select>
         <select id="rp">${["tcp", "udp"].map(p => `<option ${p === reachForm.protocol ? "selected" : ""}>${p}</option>`).join("")}</select>
         <input id="rport" value="${esc(reachForm.port)}" inputmode="numeric" aria-label="포트"><button id="rgo">판정</button></div>`
      + (res ? `<div class="verdict ${res.reachable ? "ok" : "no"}">${res.reachable ? "도달 가능" : "차단됨"}: ${esc(res.from)} → ${esc(res.to)} ${esc(res.protocol)}/${esc(res.port)}</div>`
          + res.hops.map(h => `<div class="hop ${h.ok ? "ok" : "no"}"><b>${esc(h.step)}</b> · ${esc(h.detail)}</div>`).join("") : "")
      + `<h4>서브넷</h4>` + table(["ID", "CIDR", "AZ", "라우팅 테이블", "인터넷 경로", "공인 IP 자동"], r.subnets.map(x => [x.id, x.cidr, x.az, x.route_table, x.internet ? "있음" : "없음", x.public_ip ? "켜짐" : "꺼짐"]))
      + `<h4>보안 그룹</h4>` + table(["ID", "이름", "인바운드", "아웃바운드"], r.security_groups.map(g => [g.id, g.name, g.ingress.join("\n") || "없음", g.egress.join("\n") || "없음"]))
      + `<h4>인스턴스</h4>` + table(["ID", "사설 IP", "공인 IP", "서브넷", "보안 그룹", "상태"], r.instances.map(i => [i.id, i.ip, i.public || "", i.subnet, i.sgs.join(", "), i.state]));
  } else {
    body = `<div class="sub">메시지 ${r.count}개${more} · 엿보기만 하며 수신 횟수는 바뀌지 않습니다</div>` + table(["ID", "본문", "상태", "수신 횟수"], r.messages.map(m => [m.id, m.body, m.state, m.receives]));
  }
  $("detail").innerHTML = `<h2>${esc(r.name)}</h2>` + body;
}

async function load() {
  try { state = await (await fetch("/_admin/state")).json(); } catch { return; }
  renderNav(); renderDetail();
}
let pending = null;
const loadSoon = () => { if (!pending) pending = setTimeout(() => { pending = null; load(); }, 300); };

const clock = ts => { const d = new Date(ts); return isNaN(d) ? "" : d.toTimeString().slice(0, 8) + "." + String(d.getMilliseconds()).padStart(3, "0"); };

const authCell = a => !a ? `<span class="muted">루트</span>`
  : a.decision === "allowed" ? `<span class="allow">허용</span>`
  : `<span class="deny">${a.decision === "explicitDeny" ? "명시적 거부" : "암묵적 거부"}${a.enforced ? "" : " (보고만)"}</span>`;

function renderLog() {
  const f = $("filter").value.trim().toLowerCase();
  const rows = events.filter(e => !f || `${e.service} ${e.op} ${e.status}`.toLowerCase().includes(f));
  $("logbody").innerHTML = rows.map(e => `<tr><td>${esc(clock(e.ts))}</td><td class="svc ${esc(e.service)}">${esc(e.service)}</td>
    <td>${esc(e.op)}</td><td class="st${String(e.status)[0]}">${esc(e.status)}</td>
    <td title="${esc(e.auth ? e.auth.reason : "")}">${authCell(e.auth)}</td><td>${e.ms != null ? e.ms.toFixed(1) : ""}</td>
    <td class="muted">${esc((e.principal || "").replace(/^arn:aws:(iam|sts)::\d+:/, ""))}</td></tr>`).join("");
}

const es = new EventSource("/_events");
es.onopen = () => { $("dot").className = "dot on"; $("conn").textContent = "연결됨"; load(); };
es.onerror = () => { $("dot").className = "dot"; $("conn").textContent = "연결 끊김, 재시도 중"; };
es.onmessage = m => {
  const e = JSON.parse(m.data);
  $("counter").textContent = `요청 ${++count}`;
  loadSoon();
  if ($("pause").checked) return;
  events.unshift(e); if (events.length > MAX_LOG) events.pop();
  renderLog();
};

$("detail").onclick = async ev => {
  if (ev.target.id !== "rgo") return;
  Object.assign(reachForm, {from: $("rf").value, to: $("rt").value, protocol: $("rp").value, port: $("rport").value});
  const qs = new URLSearchParams({from: reachForm.from, to: reachForm.to, protocol: reachForm.protocol, port: reachForm.port});
  reachForm.result = await (await fetch("/_admin/reach?" + qs)).json();
  renderDetail();
};
$("detail").oninput = ev => {
  const m = {rf: "from", rt: "to", rp: "protocol", rport: "port"}[ev.target.id];
  if (m) reachForm[m] = ev.target.value;
};
$("nav").onclick = ev => { const a = ev.target.closest("a"); if (!a) return; location.hash = a.dataset.svc + "/" + a.dataset.name; };
// Deep link: #<svc>/<name> selects a resource.
const fromHash = () => { const [svc, ...n] = decodeURIComponent(location.hash.slice(1)).split("/"); sel = svc ? {svc, name: n.join("/")} : null; renderNav(); renderDetail(); };
window.onhashchange = fromHash;
fromHash();
$("filter").oninput = renderLog;
$("clear").onclick = () => { events.length = 0; renderLog(); };
$("refresh").onclick = load;
$("reset").onclick = async () => {
  if (!confirm("모든 테이블, 버킷, 큐를 지웁니다. 계속할까요?")) return;
  await fetch("/_admin/reset", {method: "POST", headers: {"x-rocalcloud": "1"}});
  sel = null; load();
};
load();
</script>
</body>
</html>
