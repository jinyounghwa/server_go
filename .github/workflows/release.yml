name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-14 # ponytail: Intel 러너(macos-13) 폐지, Apple Silicon에서 교차 빌드
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build release binary
        working-directory: core
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package tarball
        run: |
          tar -C core/target/${{ matrix.target }}/release -czf rocalcloud-${{ matrix.target }}.tar.gz rocalcloud
      - uses: actions/upload-artifact@v4
        with:
          name: rocalcloud-${{ matrix.target }}
          path: rocalcloud-${{ matrix.target }}.tar.gz

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Generate checksums
        run: sha256sum rocalcloud-*.tar.gz > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            rocalcloud-*.tar.gz
            SHA256SUMS.txt
