name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Unit tests & release build
        working-directory: core
        run: |
          cargo test
          cargo build --release

      - name: Setup uv & Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: false # no uv.lock; deps are pinned per run with --with

      - name: Run Python (boto3) + JS (@aws-sdk v3) compatibility suites
        run: |
          ENFORCE_IAM=1 ./core/target/release/rocalcloud >/tmp/rocalcloud.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null; wait $PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4566/_admin/state >/dev/null && break
            sleep 0.2
          done
          curl -sf http://127.0.0.1:4566/_admin/state >/dev/null || { cat /tmp/rocalcloud.log; exit 1; }
          uv run --with boto3 --with "pyjwt[crypto]" --with pg8000 --with pymysql --with redis --with dnspython tests/sdk_test.py
          (cd tests/js && npm install --no-audit --no-fund && npm test)

      - name: Python suite again with SigV4 verification on
        run: |
          ENFORCE_IAM=1 VERIFY_SIGV4=1 ./core/target/release/rocalcloud >/tmp/rocalcloud-verify.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null; wait $PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4566/_admin/state >/dev/null && break
            sleep 0.2
          done
          curl -sf http://127.0.0.1:4566/_admin/state >/dev/null || { cat /tmp/rocalcloud-verify.log; exit 1; }
          uv run --with boto3 --with "pyjwt[crypto]" --with pg8000 --with pymysql --with redis --with dnspython tests/sdk_test.py
