[package]
name = "rocalcloud-rust-sdk-tests"
version = "0.1.0"
edition = "2021"

[dependencies]
aws-config = "1"
aws-credential-types = "1"
aws-sdk-dynamodb = "1"
aws-sdk-iam = "1"
aws-sdk-s3 = "1"
aws-sdk-sqs = "1"
aws-sdk-ssm = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
